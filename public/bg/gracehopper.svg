<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="800" fill="#5b6b86"/>
  <rect x="0" y="0" width="400" height="520" fill="#6d7f9c"/>
  <!-- name plate -->
  <rect x="110" y="34" width="180" height="40" rx="8" fill="#f7f0e6" stroke="#30323b" stroke-width="5"/>
  <text x="200" y="61" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-weight="900" font-size="17" fill="#30323b">GRACE HOPPER</text>
  <!-- whiteboard -->
  <rect x="40" y="110" width="250" height="160" rx="10" fill="#ffffff" stroke="#30323b" stroke-width="6"/>
  <g fill="none" stroke="#3b6fd4" stroke-width="4" stroke-linecap="round"><path d="M60 140 h80"/><path d="M60 165 h120"/><path d="M60 190 h60"/></g>
  <text x="200" y="245" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-weight="900" font-size="24" fill="#ff2f61">Q3 SYNC ♥</text>
  <!-- clock -->
  <g stroke="#30323b" stroke-width="5" stroke-linecap="round"><circle cx="340" cy="150" r="32" fill="#fff"/><line x1="340" y1="150" x2="340" y2="128"/><line x1="340" y1="150" x2="356" y2="158"/></g>
  <!-- floor + table -->
  <rect x="0" y="520" width="400" height="280" fill="#3f4a5e"/>
  <path d="M40 600 L360 600 L390 670 L10 670 Z" fill="#c8a27a" stroke="#30323b" stroke-width="6" stroke-linejoin="round"/>
  <!-- plant -->
  <g stroke="#30323b" stroke-width="5"><path d="M330 520 h40 l-6 -50 h-28z" fill="#f7f0e6"/><path d="M350 470 q-30 -60 0 -100 q30 40 0 100z" fill="#8fd16a"/></g>
  <!-- conference phone -->
  <path d="M180 620 l20 -12 l20 12 l-20 12z" fill="#30323b"/>
</svg>
