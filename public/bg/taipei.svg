  <g stroke="#30323b" stroke-width="4"><ellipse cx="50" cy="240" rx="14" ry="18" fill="#ff2f61"/><ellipse cx="130" cy="246" rx="14" ry="18" fill="#ffd42e"/><ellipse cx="270" cy="236" rx="14" ry="18" fill="#ff2f61"/><ellipse cx="350" cy="232" rx="14" ry="18" fill="#ffd42e"/></g>
