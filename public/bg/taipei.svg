  <rect width="400" height="800" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.8"><circle cx="40" cy="60" r="2"/><circle cx="120" cy="30" r="1.5"/><circle cx="350" cy="80" r="2"/><circle cx="260" cy="40" r="1.5"/><circle cx="80" cy="140" r="1.5"/></g>
  <circle cx="330" cy="130" r="28" fill="#ffe8a3" stroke="#30323b" stroke-width="5"/>
