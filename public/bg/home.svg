<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="800" fill="#f3c98b"/>
  <!-- wallpaper stripes -->
  <g fill="#ebb877"><rect x="0" width="20" height="520"/><rect x="60" width="20" height="520"/><rect x="120" width="20" height="520"/><rect x="180" width="20" height="520"/><rect x="240" width="20" height="520"/><rect x="300" width="20" height="520"/><rect x="360" width="20" height="520"/></g>
  <!-- night window -->
  <rect x="40" y="90" width="150" height="180" rx="8" fill="#23254a" stroke="#30323b" stroke-width="7"/>
  <line x1="115" y1="90" x2="115" y2="270" stroke="#30323b" stroke-width="5"/><line x1="40" y1="180" x2="190" y2="180" stroke="#30323b" stroke-width="5"/>
  <circle cx="155" cy="125" r="16" fill="#ffe8a3"/>
  <!-- clock at 7:00 -->
  <g stroke="#30323b" stroke-width="6" stroke-linecap="round"><circle cx="300" cy="150" r="46" fill="#fff"/><line x1="300" y1="150" x2="300" y2="116"/><line x1="300" y1="150" x2="284" y2="172"/></g>
  <text x="300" y="228" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-weight="900" font-size="18" fill="#30323b">DINNER @ 7</text>
  <!-- lamp -->
  <g stroke="#30323b" stroke-width="5"><line x1="200" y1="0" x2="200" y2="300"/><path d="M160 300 h80 l-20 -40 h-40z" fill="#ffd42e"/></g>
  <!-- floor + table -->
  <rect x="0" y="520" width="400" height="280" fill="#9b5e34"/>
  <path d="M20 600 L380 600 L400 670 L0 670 Z" fill="#fff" stroke="#30323b" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#ff2f61" stroke-width="5" opacity="0.6"><line x1="40" y1="620" x2="380" y2="620"/><line x1="30" y1="645" x2="390" y2="645"/></g>
  <!-- two plates, one empty chair -->
  <g fill="#fff" stroke="#30323b" stroke-width="5"><ellipse cx="90" cy="620" rx="34" ry="10"/><ellipse cx="310" cy="620" rx="34" ry="10"/></g>
  <rect x="290" y="540" width="60" height="60" rx="10" fill="#6b3d22" stroke="#30323b" stroke-width="5"/>
</svg>
