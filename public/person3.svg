<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- The VP: cartoon based on the team's AI-generated reference -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#f4f4f6"/>
      <stop offset="100%" stop-color="#c9cbd2"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>

  <g stroke="#30323b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- wavy shoulder-length hair, back layer -->
    <path d="M200 70
             C140 66 100 112 98 170
             C90 196 104 214 96 238
             C86 262 104 282 96 304
             C90 326 112 346 136 340
             C150 352 170 348 176 336
             L224 336
             C230 348 250 352 264 340
             C288 346 310 326 304 304
             C296 282 314 262 304 238
             C296 214 310 196 302 170
             C300 112 260 66 200 70 Z" fill="#a8743f"/>
    <!-- neck -->
    <path d="M176 290 L176 352 L224 352 L224 290 Z" fill="#efc09c"/>
    <!-- body: navy scoop-neck top -->
    <path d="M52 500 C56 414 104 352 200 352 C296 352 344 414 348 500 Z" fill="#2c3e75"/>
    <!-- scoop neckline (skin) -->
    <path d="M150 356 C160 392 240 392 250 356 C232 352 168 352 150 356 Z" fill="#efc09c"/>
    <!-- head -->
    <ellipse cx="200" cy="208" rx="76" ry="90" fill="#f4caa8"/>
    <!-- center-parted wavy top hair framing the face -->
    <path d="M124 214
             C112 160 140 102 200 98
             C260 102 288 160 276 214
             C268 188 256 164 236 150
             C222 140 206 134 200 120
             C194 134 178 140 164 150
             C144 164 132 188 124 214 Z" fill="#b98049"/>
    <!-- curls along the sides -->
    <path d="M124 214 C112 236 130 252 118 274 C108 292 124 308 116 324" fill="none"/>
    <path d="M276 214 C288 236 270 252 282 274 C292 292 276 308 284 324" fill="none"/>
  </g>
  <!-- highlight strands -->
  <g fill="none" stroke="#d9a466" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M150 150 C140 176 136 200 138 224"/>
    <path d="M250 150 C260 176 264 200 262 224"/>
    <path d="M116 250 C108 270 116 290 110 310"/>
    <path d="M284 250 C292 270 284 290 290 310"/>
  </g>
  <!-- eyebrows -->
  <path d="M152 186 C162 178 176 178 186 184 M214 184 C224 178 238 178 248 186" fill="none" stroke="#6b4423" stroke-width="5" stroke-linecap="round"/>
  <!-- eyes: friendly, slightly squinting from smiling -->
  <path d="M156 210 C164 202 178 202 184 210" fill="none" stroke="#30323b" stroke-width="5" stroke-linecap="round"/>
  <path d="M216 210 C222 202 236 202 244 210" fill="none" stroke="#30323b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="170" cy="212" r="5" fill="#30323b"/>
  <circle cx="230" cy="212" r="5" fill="#30323b"/>
  <!-- nose -->
  <path d="M200 222 C196 238 194 246 202 248" fill="none" stroke="#c98b66" stroke-width="4" stroke-linecap="round"/>
  <!-- big warm smile with teeth -->
  <path d="M164 262 C178 296 222 296 236 262 Z" fill="#ffffff" stroke="#30323b" stroke-width="6" stroke-linejoin="round"/>
  <path d="M168 266 C190 272 210 272 232 266" fill="none" stroke="#30323b" stroke-width="3"/>
  <!-- cheeks -->
  <ellipse cx="148" cy="246" rx="13" ry="8" fill="#f45caf" opacity="0.35"/>
  <ellipse cx="252" cy="246" rx="13" ry="8" fill="#f45caf" opacity="0.35"/>
  <!-- buttons on the top -->
  <circle cx="200" cy="430" r="5" fill="#1e2b55" stroke="#30323b" stroke-width="3"/>
  <circle cx="200" cy="460" r="5" fill="#1e2b55" stroke="#30323b" stroke-width="3"/>
  <!-- small VP badge clipped on -->
  <g stroke="#30323b" stroke-width="5" stroke-linejoin="round">
    <rect x="252" y="400" width="54" height="38" rx="7" fill="#ffd42e"/>
  </g>
  <text x="279" y="427" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-size="20" font-weight="900" fill="#30323b">VP</text>
</svg>
